<h1>Log in</h1>

{% if form.errors %}
  <p>Username or password is incorrect.</p>
{% endif %}

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Login</button>
</form>

<p><a href="{% url 'register' %}">Create an account</a></p>
